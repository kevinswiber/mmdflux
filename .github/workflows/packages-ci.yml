name: Packages CI

on:
  push:
    paths:
      - "packages/**"
      - ".github/workflows/packages-ci.yml"
      - "crates/mmdflux-wasm/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - ".github/workflows/wasm-release.yml"
  pull_request:
    paths:
      - "packages/**"
      - ".github/workflows/packages-ci.yml"
      - "crates/mmdflux-wasm/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Justfile"
      - ".github/workflows/wasm-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WASM_PACK_VERSION: "0.14.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install dependencies
        working-directory: packages
        run: npm ci

      - name: Check formatting and lint
        working-directory: packages
        run: npm run check -ws

      - name: Check @mmds/wasm peer-dep range covers crate version
        run: bash scripts/check-browser-text-metrics-wasm-peer.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install dependencies
        working-directory: packages
        run: npm ci

      - name: Build all packages
        working-directory: packages
        run: npm run build -ws

      - name: Run tests
        working-directory: packages
        run: npm test -ws

  cross-package-integration:
    name: Cross-package integration with @mmds/wasm
    runs-on: ubuntu-latest
    needs:
      - test
    env:
      MMDS_WASM_PACKED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: packages-cross-package-integration

      - name: Install wasm-pack (pinned to WASM_PACK_VERSION)
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1 || [[ "$(wasm-pack --version | awk '{print $2}')" != "${WASM_PACK_VERSION}" ]]; then
            cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
          fi
          wasm-pack --version

      - name: Build @mmds/wasm bundler target (matches wasm-release.yml)
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: wasm-pack build crates/mmdflux-wasm --target bundler --release --out-dir ../../target/wasm-pkg-release

      - name: Rewrite name to @mmds/wasm and pack
        working-directory: target/wasm-pkg-release
        run: |
          npm pkg set name='@mmds/wasm'
          npm pack

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install workspace dependencies
        working-directory: packages
        run: npm ci

      - name: Install packed @mmds/wasm into browser-metrics package
        working-directory: packages
        run: npm install ./../target/wasm-pkg-release/mmds-wasm-*.tgz --workspace @mmds/browser-text-metrics --no-save

      - name: Build packages
        working-directory: packages
        run: npm run build -ws

      - name: Run contract tests against packed @mmds/wasm
        working-directory: packages
        run: npm test --workspace @mmds/browser-text-metrics
